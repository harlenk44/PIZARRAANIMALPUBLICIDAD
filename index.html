    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return originalFetch;
            },
            set: function (val) {
              originalFetch = val;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {}

        window.addEventListener(
          'error',
          function (event) {
            if (
              (event.filename && event.filename.includes('chrome-extension://')) ||
              (event.message && event.message.includes('Cannot set property fetch'))
            ) {
              event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') {
                event.stopImmediatePropagation();
              }
              return true;
            }
          },
          true
        );
      })();
    </script>
  </head>
